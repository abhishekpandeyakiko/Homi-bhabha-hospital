<!DOCTYPE html>
<html class="scroll-smooth" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Book Appointment – Homi Bhabha Cancer Hospital & RC</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@100..700,0..1,-50..200,24&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        fontFamily: { sans: ['Inter', 'sans-serif'] },
        extend: {
          colors: {
            "primary": "#0B63E5",
            "primary-dark": "#094eb5",
            "secondary": "#0097A7",
            "brand-red": "#C0122C",
            "dark-navy": "#0A1C30",
            "surface": "#F4F8FC",
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="assets/scss/custom.css">
  <link rel="stylesheet" href="assets/scss/header.css">
</head>

<body class="bg-[#F4F8FC] text-dark-navy font-sans">

  <!-- Header -->
  <div id="header-container"></div>

  <!-- Appointment Content -->
  <!-- ===================================================
       APPOINTMENT PAGE CONTENT
  ==================================================== -->
  <main class="min-h-screen bg-[#edf5ff] py-12 px-4">
    <div class="max-w-[1200px] mx-auto">

      <!-- Page Header -->
      <div class="mb-10 flex items-center justify-between flex-wrap gap-4">
        <div>
          <p class="text-[#007aff] text-[11px] font-extrabold tracking-widest uppercase mb-1">Hospital Services</p>
          <h1 class="text-3xl sm:text-4xl font-extrabold text-[#112A46] leading-tight">Book an Appointment</h1>
          <p class="text-slate-500 text-sm mt-2 font-medium">Fill in your details below and our team will confirm your appointment shortly.</p>
        </div>
        <a href="index.html"
          class="inline-flex items-center gap-2 bg-white border border-[#b2ccff] text-[#007aff] px-5 py-2.5 rounded-[6px] text-sm font-bold hover:bg-[#f0f7ff] transition-all shadow-sm">
          <span class="material-symbols-outlined text-base">arrow_back</span>
          Back to Home
        </a>
      </div>

      <!-- Appointment Card -->
      <div class="bg-[#f4f9ff] rounded-[2rem] shadow-[0_10px_40px_-10px_rgba(0,122,255,0.12)] flex flex-col lg:flex-row relative overflow-hidden border border-white">

        <!-- Left: Image -->
        <div class="lg:w-1/2 relative min-h-[280px] lg:min-h-[520px]">
          <img src="assets/img/book_appointment.png" alt="Make Appointment" class="w-full h-full object-cover" />
          <!-- Fade overlay -->
          <div class="absolute inset-y-0 right-0 w-1/2 bg-gradient-to-r from-transparent to-[#f4f9ff]"></div>
          <!-- Floating icon -->
          <div class="absolute top-[20%] right-[10%] text-red-600 animate-pulse drop-shadow-lg">
            <i class="fa-solid fa-heart-pulse text-3xl"></i>
          </div>
          <!-- Info badges -->
          <div class="absolute bottom-6 left-6 flex flex-col gap-2">
            <div class="bg-white/90 backdrop-blur-sm rounded-[6px] px-4 py-2 shadow-md flex items-center gap-2 text-[12px] font-bold text-[#112A46]">
              <span class="material-symbols-outlined text-[#007aff] text-base">schedule</span>
              Mon–Sat, 8:00 AM – 2:00 PM
            </div>
            <div class="bg-white/90 backdrop-blur-sm rounded-[6px] px-4 py-2 shadow-md flex items-center gap-2 text-[12px] font-bold text-[#112A46]">
              <span class="material-symbols-outlined text-[#007aff] text-base">phone</span>
              +91-172-2290100
            </div>
          </div>
        </div>

        <!-- Right: Form -->
        <div class="lg:w-1/2 p-8 sm:p-12 lg:p-14 relative bg-[#f4f9ff] flex flex-col justify-center">

          <!-- Decorative bg icon -->
          <div class="absolute right-0 bottom-0 opacity-[0.03] pointer-events-none transform translate-x-1/4 translate-y-1/4">
            <i class="fa-solid fa-dna text-[250px] text-[#007aff] -rotate-45"></i>
          </div>

          <div class="relative z-10">
            <h5 class="text-[#007aff] text-[11px] font-extrabold tracking-widest uppercase mb-3">Online Appointment</h5>
            <h2 class="text-2xl lg:text-[26px] font-extrabold text-[#112A46] leading-[1.3] mb-8">
              Make an Online Appointment<br class="hidden sm:block" /> Booking for Treatment Patients
            </h2>

            <form class="space-y-4" onsubmit="return false;">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="text" placeholder="Your Name *"
                  class="w-full px-5 py-3.5 rounded-[6px] border border-[#b2ccff] bg-[#e6f0ff]/40 text-sm focus:bg-white focus:border-[#007aff] focus:ring-1 focus:ring-[#007aff] outline-none transition-all text-[#112A46] placeholder-[#6b85a3] font-semibold" />
                <input type="email" placeholder="Your E-Mail *"
                  class="w-full px-5 py-3.5 rounded-[6px] border border-[#b2ccff] bg-[#e6f0ff]/40 text-sm focus:bg-white focus:border-[#007aff] focus:ring-1 focus:ring-[#007aff] outline-none transition-all text-[#112A46] placeholder-[#6b85a3] font-semibold" />
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="text" placeholder="Department / Subject *"
                  class="w-full px-5 py-3.5 rounded-[6px] border border-[#b2ccff] bg-[#e6f0ff]/40 text-sm focus:bg-white focus:border-[#007aff] focus:ring-1 focus:ring-[#007aff] outline-none transition-all text-[#112A46] placeholder-[#6b85a3] font-semibold" />
                <input type="tel" placeholder="Phone Number"
                  class="w-full px-5 py-3.5 rounded-[6px] border border-[#b2ccff] bg-[#e6f0ff]/40 text-sm focus:bg-white focus:border-[#007aff] focus:ring-1 focus:ring-[#007aff] outline-none transition-all text-[#112A46] placeholder-[#6b85a3] font-semibold" />
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <input type="date"
                  class="w-full px-5 py-3.5 rounded-[6px] border border-[#b2ccff] bg-[#e6f0ff]/40 text-sm focus:bg-white focus:border-[#007aff] focus:ring-1 focus:ring-[#007aff] outline-none transition-all text-[#112A46] font-semibold" />
                <input type="text" placeholder="Address"
                  class="w-full px-5 py-3.5 rounded-[6px] border border-[#b2ccff] bg-[#e6f0ff]/40 text-sm focus:bg-white focus:border-[#007aff] focus:ring-1 focus:ring-[#007aff] outline-none transition-all text-[#112A46] placeholder-[#6b85a3] font-semibold" />
              </div>
              <textarea placeholder="Type Your Message / Symptoms" rows="4"
                class="w-full px-5 py-4 rounded-[6px] border border-[#b2ccff] bg-[#e6f0ff]/40 text-sm focus:bg-white focus:border-[#007aff] focus:ring-1 focus:ring-[#007aff] outline-none transition-all resize-none text-[#112A46] placeholder-[#6b85a3] font-semibold"></textarea>

              <div class="pt-2">
                <button type="submit"
                  class="bg-[#007aff] hover:bg-blue-600 text-white px-8 py-3.5 rounded-[6px] font-bold text-sm shadow-md transition-all active:scale-95 inline-flex items-center gap-2">
                  Submit Appointment
                  <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                </button>
              </div>
            </form>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <div id="footer-container"></div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      async function loadComponent(id, url) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          document.getElementById(id).innerHTML = await res.text();
        } catch (e) {
          console.error('Failed to load', url, e);
        }
      }
      await loadComponent('header-container', 'components/header.html');
      await loadComponent('footer-container', 'components/footer.html');
      window.dispatchEvent(new Event('componentsLoaded'));
    });
  </script>
  <script src="assets/js/main.js"></script>
</body>

</html>
