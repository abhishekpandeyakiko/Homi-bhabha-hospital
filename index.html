<!DOCTYPE html>
<html class="scroll-smooth" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Homi Bhabha Cancer Hospital &amp; Research Centre</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL,GRAD,opsz@100..700,0..1,-50..200,24&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        fontFamily: {
          sans: ['Inter', 'sans-serif'],
        },
        extend: {
          "colors": {
            "primary": "#0B63E5",       /* Mediic Theme Blue */
            "primary-dark": "#094eb5",
            "secondary": "#0097A7",     /* Logo Teal Accent */
            "brand-red": "#C0122C",     /* Hospital Crimson */
            "dark-navy": "#0A1C30",     /* Base Navy */
            "surface": "#F4F8FC",       /* Ice Light Bg */
            "surface-card": "#FFFFFF",
            "text-main": "#2C3E50",
            "text-light": "#7F8C8D"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "2xl": "1rem",
            "3xl": "1.5rem",
            "full": "9999px"
          },
          "spacing": {
            "xl": "40px",
            "gutter": "24px",
            "container-max": "1320px",
            "sm": "8px",
            "lg": "24px",
            "md": "16px",
            "xs": "4px",
            "unit": "4px"
          },
          "fontFamily": {
            "sans": ["Inter", "sans-serif"],
            "devanagari": ["Noto Sans Devanagari", "sans-serif"]
          }
        },
      },
    }
  </script>
  <link rel="stylesheet" href="assets/scss/custom.css">
</head>

<body class="bg-[#F4F8FC] text-dark-navy overflow-x-hidden font-sans">
  <div id="header-container"></div>
  <div id="home-container"></div>
  <div id="footer-container"></div>
